services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: requimeet
      POSTGRES_PASSWORD: requimeet
      POSTGRES_DB: requimeet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U requimeet"]
      interval: 5s
      timeout: 3s
      retries: 10

  # LiveKit server en modo dev (clave devkey/secret, ver .env.example).
  # --node-ip: la IP que el SFU anuncia en sus candidatos ICE.
  # Para uso solo en esta maquina: 127.0.0.1. Para probar desde OTROS
  # dispositivos en tu red, pon la IP LAN de esta maquina (p.ej. en
  # LIVEKIT_NODE_IP del .env: 192.168.40.123) y ajusta VITE_* en apps/web.
  livekit:
    image: livekit/livekit-server:v1.13.9
    command: --dev --bind 0.0.0.0 --node-ip ${LIVEKIT_NODE_IP:-127.0.0.1}
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

volumes:
  pgdata:
