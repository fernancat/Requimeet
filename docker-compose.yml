services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: requimeet
      POSTGRES_PASSWORD: requimeet
      POSTGRES_DB: requimeet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U requimeet"]
      interval: 5s
      timeout: 3s
      retries: 10

  # LiveKit server en modo dev (clave devkey/secret, ver .env.example).
  # --node-ip 127.0.0.1: la IP que el SFU anuncia en sus candidatos ICE.
  # Sin ella (y sin el puerto UDP 7882 mapeado) el navegador no alcanza los
  # candidatos y cae al relay TCP: video que parpadea y audio con delay.
  # Para probar desde OTRO dispositivo en tu red, cambia 127.0.0.1 por la IP
  # LAN de esta maquina (p.ej. 192.168.1.50).
  livekit:
    image: livekit/livekit-server:v1.13.9
    command: --dev --bind 0.0.0.0 --node-ip 127.0.0.1
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

volumes:
  pgdata:
